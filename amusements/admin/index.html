<!-- STEP 2: Admin Login Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="icon" type="image/png" href="../Images/AMUIco.png">
  <link rel="apple-touch-icon" href="../Images/AMUIco.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-login-container fade-in">
    <h2 class="admin-title">Admin Login</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit" class="admin-login-btn">Login</button>
    </form>
    <div id="error-message" class="error-message" style="display:none;"></div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
<!-- STEP 2 END -->
