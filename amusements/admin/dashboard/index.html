<!-- STEP 4: Admin Dashboard History View -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="icon" type="image/png" href="../../Images/AMUIco.png">
  <link rel="apple-touch-icon" href="../../Images/AMUIco.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <h1 class="dashboard-title">Admin Dashboard</h1>
      <p class="subtext">Smart Business Fusion – Internal</p>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </header>
    <main class="dashboard-main">
      <div id="access-check-overlay" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;background:#181a20e6;backdrop-filter:blur(2px);align-items:center;justify-content:center;font-size:1.5rem;color:#e3e6ee;"><span>Checking access...</span></div>
      <div id="offline-banner" class="dashboard-card" style="display:none;color:#ff6b6b;font-weight:600;text-align:center;"></div>
      <div id="stale-indicator" class="dashboard-card" style="display:none;color:orange;font-weight:600;text-align:center;"></div>
      <section class="dashboard-card" id="summary-section">
        <div class="summary-cards">
          <div class="summary-card" id="card-online">Operating Time<br><span class="summary-value" id="online-seconds">--</span></div>
          <div class="summary-card" id="card-game">Game Time<br><span class="summary-value" id="game-seconds">--</span></div>
          <div class="summary-card" id="card-idle">Idle Time<br><span class="summary-value" id="idle-seconds">--</span></div>
          <div class="summary-card" id="card-sessions">Sessions<br><span class="summary-value" id="sessions-count">--</span></div>
        </div>
        <div id="last-updated" style="margin-top:10px;color:#bfc8e6;font-size:0.98em;"></div>
      </section>
      <section class="dashboard-card" id="controls-section">
        <div class="controls-row">
          <label>Range:
            <select id="range-select">
              <option value="1h">Last 1 hour</option>
              <option value="24h" selected>Last 24 hours</option>
              <option value="7d">Last 7 days</option>
            </select>
          </label>
          <label>Sort:
            <select id="sort-select">
              <option value="newest" selected>Newest</option>
              <option value="oldest">Oldest</option>
              <option value="duration_desc">Longest duration</option>
              <option value="duration_asc">Shortest duration</option>
              <option value="game_asc">Game A–Z</option>
            </select>
          </label>
          <label>Headset:
            <select id="headset-select">
              <option value="">All</option>
            </select>
          </label>
          <label>Search:
            <input type="text" id="search-input" placeholder="Game package/name" />
          </label>
          <button id="refresh-btn" class="refresh-btn">Refresh</button>
        </div>
      </section>
      <section class="dashboard-card" id="timeline-section">
        <h2>Session Timeline</h2>
        <div id="timeline-table-container"></div>
        <div id="pagination-controls" style="margin-top:12px;text-align:center;"></div>
      </section>
      <section class="dashboard-card" id="game-totals-section">
        <h2>Game Totals</h2>
        <div id="game-totals-table-container"></div>
      </section>
    </main>
    <div id="error-message" class="error-message" style="display:none;"></div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
<!-- STEP 4 END -->
